name: cilock-action smoke (gh CLI build)

# Downstream consumer test: attest a real-world Go build using
# `uses: aflock-ai/cilock-action@v1.0.5-rc6`. The gh CLI is a
# meaningful workload — 100s of dependencies, real Makefile,
# /opt/hostedtoolcache reads, multi-package go build.
#
# Confirms cilock-action delivers a real attestation for a popular
# OSS project without any code changes to the project itself.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cilock-smoke.yml'

permissions:
  contents: read
  id-token: write  # sigstore keyless via GHA OIDC

jobs:
  build-with-cilock:
    name: gh CLI build with cilock attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          cat /proc/version
          df -h / /tmp /opt 2>/dev/null | head

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Attest gh CLI build with cilock
        uses: aflock-ai/cilock-action@v1.0.5-rc13
        with:
          step: gh-cli-build
          # gh build into the workspace so the default product scope
          # (workingDir/**) captures it. Real-world multi-package build,
          # uses /opt/hostedtoolcache/go, hits dependency cache.
          command: go build -o bin/gh ./cmd/gh
          # Explicit products list — just the gh binary. Without this
          # the default would still match (it's under workingDir) but
          # being explicit documents intent.
          products: |
            bin/gh
          trace: 'true'
          outfile: /tmp/gh-build-attestation.json
          enable-archivista: 'false'

      - name: Verify attestation + report
        if: always()
        run: |
          if [ ! -f /tmp/gh-build-attestation.json ]; then
            echo "::error::no attestation produced"
            exit 1
          fi
          BYTES=$(wc -c < /tmp/gh-build-attestation.json)
          echo "attestation size: $BYTES bytes"
          jq -r '.payload' /tmp/gh-build-attestation.json | base64 -d > /tmp/payload.json
          echo "=== predicate type ==="
          jq -r '.predicateType' /tmp/payload.json
          echo "=== command-run summary ==="
          jq '.predicate.attestations[]? | select(.type | test("command-run")) | .attestation | {
                cmd: .cmd,
                exit: .exitcode,
                processes: (.processes | length),
                totals: .summary.totals,
                outliers: .summary.outliers,
                diagnostics: .summary.diagnostics
              }' /tmp/payload.json
          echo "=== product tree (v0.3 Merkle summary) ==="
          # v0.3 product attestor publishes only the Merkle root + treeSize
          # in the predicate (leaf paths are kept off-envelope to bound
          # attestation size for builds with many outputs). The treeSize
          # IS the product count.
          PRODS=$(jq -r '[.predicate.attestations[]? | select(.type | test("product/v0\\.3")) | .attestation.treeSize] | first // 0' /tmp/payload.json)
          MAT=$(jq -r '[.predicate.attestations[]? | select(.type | test("material/v0\\.3")) | .attestation.treeSize] | first // 0' /tmp/payload.json)
          echo "products (Merkle leaves): $PRODS"
          echo "materials (Merkle leaves): $MAT"
          # Also expose summary totals for context — these are the
          # trace's PRE-attestor classification, which can disagree
          # with the final tree (exists-at-exit + dedup filter).
          jq '.predicate.attestations[]? | select(.type | test("command-run")) | .attestation.summary.totals' /tmp/payload.json
          # Assertion: with explicit products: bin/gh on a real Go
          # build, expect at least 1 product in the tree and a
          # non-trivial material count.
          if [ "${PRODS:-0}" -lt 1 ]; then
            echo "::error::no products in Merkle tree — bin/gh was either not classified as a product or was rejected by exists-at-exit. summary.totals above shows the trace's view."
            exit 1
          fi
          if [ "${PRODS:-0}" -gt 100 ]; then
            echo "::error::product over-classification: $PRODS — expected single-digit. include-glob isn't filtering."
            exit 1
          fi
          if [ "${MAT:-0}" -lt 10 ]; then
            echo "::error::material count suspiciously low ($MAT) — trace likely degraded"
            exit 1
          fi
          echo "✓ product classification healthy (${PRODS} products, ${MAT} materials)"

      - name: Upload attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-cli-attestation
          path: /tmp/gh-build-attestation.json
          if-no-files-found: warn
